# MagicDAB with an RTL-SDR stick: `docker compose up -d`, then http://localhost:3222
# The admin password is logged at the first start (or set MAGICDAB_ADMIN_PASSWORD).
# Watchtower below keeps the image up to date: it updates only the containers with
# the label com.centurylinklabs.watchtower.scope=magicdab, so it leaves the other
# containers of the host (and another Watchtower) alone. It takes whatever the
# registry has under "latest": to choose the updates yourself, name a version
# (ghcr.io/techkrzysiek/magicdab:0.3.N) and leave Watchtower out; an image can be
# checked against the build that made it (README, "Docker").
services:
  magicdab:
    image: ghcr.io/techkrzysiek/magicdab:latest
    # or built from this repository (then without Watchtower): build: .
    container_name: magicdab
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: magicdab
    # the receiver before other work on the host (audio without gaps)
    cpu_shares: 8192
    # nothing in the container gains rights it was not started with, and it
    # has none of root's special ones but reading and writing files of other
    # users (a data folder made by another one)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    ports:
      # (3222 on this computer: 8080 is often FM-DX-Webserver's)
      - "3222:8080"
    volumes:
      - ./data:/data
      # USB devices; together with the cgroup rule this survives re-plugging the stick
      - /dev/bus/usb:/dev/bus/usb
      # FM tuner (FM-DX-Tuner) for DAB/FM service following: the serial port is
      # found below /dev/hostdev/serial/by-id, audio in /dev/snd
      # - /dev:/dev/hostdev
      # - /dev/snd:/dev/snd
    device_cgroup_rules:
      - "c 189:* rmw"
      # FM tuner: USB serial (ttyACM) and ALSA
      # - "c 166:* rmw"
      # - "c 116:* rmw"
    environment:
      TZ: Europe/Warsaw
      MAGICDAB_ADMIN_PASSWORD: ${MAGICDAB_ADMIN_PASSWORD:-}
    # a log that never blocks the receiver and does not fill the disk
    logging:
      driver: json-file
      options:
        mode: non-blocking
        max-buffer-size: 4m
        max-size: 20m
        max-file: "5"
    # without a stick: a remote rtl_tcp server
    # command: ["--rtltcp", "rtl-tcp.example.org:1234"]
    # (ETI/EDI streams and IQ recordings are mapped to channels in Settings > Receiver)

  # a new release of the image: pulled and MagicDAB restarted with it, at 4:30 at night
  # (a restart is a short break for the listeners)
  watchtower:
    # the maintained Watchtower (containrrr/watchtower is archived), one release
    # by its digest: it holds the Docker socket, so not whatever "latest" is
    image: nickfedor/watchtower:1.24.0@sha256:e96976bcbeaf0a9adeddc9016a539c27a2245ef6bb7d3ca97ed106783350d387
    container_name: watchtower-magicdab
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.scope: magicdab
    environment:
      TZ: Europe/Warsaw
      WATCHTOWER_SCOPE: magicdab
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 30 4 * * *"
      WATCHTOWER_CLEANUP: "true"
