# A release: the packages for Windows, Linux (x64, arm64) and macOS with one
# update manifest (latest.json) on the GitHub release page, and the Docker
# image (the server alone) on ghcr.io.
#
# Every push to main that changes the program is a release (version: the
# last v0.3.* tag plus one, so no numbers are skipped); so is a pushed tag like v0.3.0, or a run from the
# Actions tab. Installed copies look for updates at
# releases/latest/download/latest.json of this repository.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    # (texts and the workflows only: no new version; a tag or the Actions tab
    # releases anyway)
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.github/**']

permissions:
  contents: write
  packages: write
  # (starting android.yml for the release)
  actions: write

# (one release at a time, in the order of the pushes)
concurrency:
  group: release
  cancel-in-progress: false

env:
  UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
  SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version and notes
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else last=$(git describe --tags --abbrev=0 --match 'v0.3.*' 2>/dev/null || echo v0.3.0); v="0.3.$((${last##*.} + 1))"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # what changed since the previous release
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | head -n 30 > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-notes
          path: notes.md

  windows:
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Windows package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
        run: build/windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-windows
          path: |
            dist/windows/MagicDAB-*-windows-x64.zip
            dist/windows/latest.json
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      matrix:
        # arm64: Raspberry Pi 4/5 and other 64-bit ARM boards (GitHub's ARM
        # runners are there for public repositories only; a private one would
        # wait for a runner forever)
        runner: ${{ github.event.repository.private && fromJSON('["ubuntu-26.04"]') || fromJSON('["ubuntu-26.04", "ubuntu-26.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    # (a release without the arm64 package rather than none)
    continue-on-error: ${{ matrix.runner == 'ubuntu-26.04-arm' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Linux package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
        run: build/linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-linux-${{ matrix.runner }}
          path: |
            dist/linux/MagicDAB-*-linux-*.zip
            dist/linux/latest-linux-*.json
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-26
    # (built here only: a broken macOS build does not hold up the others)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build tools
        run: brew install pkgconf cmake || true
      - name: macOS package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
        run: build/macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-macos
          path: |
            dist/macos/MagicDAB-*-macos.zip
            dist/macos/latest-macos.json
          if-no-files-found: error

  release:
    needs: [version, windows, linux, macos]
    # (the Windows and x64 Linux packages at least)
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      # (the keys the program believes, for the check of the signing key)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: crates/server/src/update.rs
          sparse-checkout-cone-mode: false
      # (ours only: the Docker job leaves a build record that is no zip)
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: One manifest for every package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          test -n "$(ls dist/MagicDAB-*-linux-x64.zip 2>/dev/null)" || { echo "::error::no Linux x64 package"; exit 1; }
          python3 - <<'PY'
          import glob, json, os
          version = os.environ["VERSION"]
          # the Windows manifest first (it has the notes), then the others' entries
          manifest = json.load(open("dist/latest.json"))
          manifest["notes"] = open("dist/notes.md").read().strip() or None
          for f in sorted(glob.glob("dist/latest-*.json")):
              part = json.load(open(f))
              assert part.pop("version") == version, f
              manifest.update(part)
          manifest = {k: v for k, v in manifest.items() if v is not None}
          json.dump(manifest, open("dist/latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
      # installed copies believe a manifest only with its signature
      # (crates/server/src/update.rs, SIGNING_KEYS): Ed25519 of its bytes
      - name: Signature of the manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::no UPDATE_SIGNING_KEY secret: installed copies would refuse this release"; exit 1; }
          umask 077
          key=$(mktemp)
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/latest.json -out dist/latest.json.sig
          # the key of the program, checked before anything is published
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          rm -f "$key"
          grep -q "\"$pub\"" crates/server/src/update.rs || { echo "::error::the signing key is not one of SIGNING_KEYS in update.rs"; exit 1; }
          test "$(wc -c < dist/latest.json.sig)" -eq 64
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "MagicDAB $VERSION" --notes-file dist/notes.md \
            dist/MagicDAB-$VERSION-*.zip dist/latest.json dist/latest.json.sig
      # the Android APK joins the release (android.yml): the tag made above with
      # the workflow's token starts no workflow by itself, a dispatch does (a
      # pushed tag started android.yml already)
      - name: Android app
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh workflow run android.yml --ref "v$VERSION"

  # the image for x64 and arm64 (Raspberry Pi), each built on its own runner,
  # then one tag for both
  docker:
    needs: version
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-26.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    # (an image without arm64 rather than none)
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/magicdab" >> "$GITHUB_OUTPUT"
      - name: Docker image
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ steps.img.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Digest
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  docker-tags:
    needs: [version, docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: One tag for every architecture
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/magicdab"
          test -n "$(ls digests)" || { echo "::error::no image built"; exit 1; }
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:latest" $(for d in digests/*; do echo "$image@sha256:${d#digests/}"; done)
          docker buildx imagetools inspect "$image:$VERSION"
