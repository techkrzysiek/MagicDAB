# The Android app (docs/android.md): the server built with the runner's NDK
# and the APKs, kept as an artifact of the run; for tags the signed APK also
# goes on the release page.
#
# Run it from the Actions tab (version 0.3.<number of commits>-dev) or push a tag
# like v0.3.30 (release.yml makes the release of the tag, the APK joins it).
# A signed release APK needs the secrets ANDROID_KEYSTORE (the keystore in
# base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD;
# without them the release APK is unsigned and the debug APK is the one to
# install (signed with a key of its own run: uninstall the previous one first).
name: Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.3.$(git rev-list --count HEAD)-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "NDK: ${ANDROID_NDK_HOME:-none}, SDK: ${ANDROID_HOME:-none}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # (the version of android/gradle/wrapper/gradle-wrapper.properties)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web interface
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Codecs and librtlsdr cache (built with the NDK)
        uses: actions/cache@v4
        with:
          path: ~/.cache/magicdab-codecs
          key: android-codecs-${{ hashFiles('build/android/build.sh', 'build/android/rtlsdr-open-fd.patch') }}
      - name: Signing key
        if: env.SIGNED == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/magicdab.keystore"
          echo "MAGICDAB_KEYSTORE=$RUNNER_TEMP/magicdab.keystore" >> "$GITHUB_ENV"
      - name: Server and APKs
        env:
          VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
          SOURCE_URL: https://github.com/${{ github.repository }}
          # phones (the app's only input is a stick on USB: nothing to try on an emulator)
          ABIS: arm64-v8a
          APK: debug release
          SKIP_WEB: 1
          MAGICDAB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAGICDAB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAGICDAB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: CODECS_DIR="$HOME/.cache/magicdab-codecs" build/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MagicDAB-${{ steps.v.outputs.version }}-android
          path: dist/android/*.apk
          if-no-files-found: error
      - name: On the release page
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ "$SIGNED" != true ]; then
            echo "::notice::no signing key (secret ANDROID_KEYSTORE): the APK stays an artifact of this run"
            exit 0
          fi
          # the release of the tag comes from release.yml (Windows package, Docker image): wait for it
          for i in $(seq 120); do
            gh release view "v$VERSION" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "v$VERSION" "dist/android/MagicDAB-$VERSION-android.apk" --clobber
