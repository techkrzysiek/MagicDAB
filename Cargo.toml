[workspace]
resolver = "2"
members = ["crates/dab", "crates/codecs", "crates/sdr", "crates/fm", "crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/techkrzysiek/MagicDAB"
# the server (Debian 13 ships Rust 1.85); the Windows application with its
# window and tray icon (feature `desktop`) needs Rust 1.90
rust-version = "1.85"

[workspace.lints.clippy]
# DSP loops index several arrays with one variable
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
# events and states moved whole between threads, not stored in bulk
large_enum_variant = "allow"

[workspace.dependencies]
num-complex = "0.4"
rustfft = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

# DSP code is unusable without optimisation, keep dev builds fast enough for real time
[profile.dev]
opt-level = 2
debug = 1
